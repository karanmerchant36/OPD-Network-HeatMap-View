<title>Pune OPD Network Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:#f8f9fa}
#app{display:flex;flex-direction:column;height:100vh}
#summarybar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:9px 16px;background:#fff;border-bottom:1px solid #e0e0e0;flex-shrink:0}
.scard{background:#f1f3f4;border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:12px}
.scard-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.scard-label{font-size:11px;color:#5f6368;margin-bottom:1px;font-weight:500}
.scard-val{font-size:20px;font-weight:700;color:#202124}
#topbar{display:flex;align-items:center;gap:7px;padding:7px 16px;background:#fff;border-bottom:1px solid #e0e0e0;flex-wrap:wrap;flex-shrink:0}
.app-title{font-size:14px;font-weight:700;color:#202124;margin-right:4px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.fg{display:flex;align-items:center;gap:4px}
.fg label{font-size:12px;color:#5f6368;white-space:nowrap;font-weight:500}
select,input[type=text]{font-size:12px;padding:4px 8px;border:1px solid #dadce0;border-radius:7px;background:#fff;color:#202124;height:30px;outline:none}
select:focus,input:focus{border-color:#1a73e8}
#srch{width:140px}
#mapwrap{flex:1;position:relative;overflow:hidden}
#map{width:100%;height:100%}
#status-screen{position:absolute;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:3000}
.status-card{background:#fff;border:1px solid #e0e0e0;border-radius:16px;padding:28px 36px;max-width:480px;width:90%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.spinner{width:38px;height:38px;border:3px solid #e8f0fe;border-top-color:#1a73e8;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.status-title{font-size:17px;font-weight:600;color:#202124;margin-bottom:7px}
.status-msg{font-size:13px;color:#5f6368;line-height:1.7}
.err-box{background:#f8f9fa;border-radius:9px;padding:12px 16px;font-size:12px;color:#3c4043;line-height:2;text-align:left;margin-top:12px}
.retry-btn{display:inline-block;margin-top:14px;padding:9px 22px;background:#1a73e8;color:#fff;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none}
#panel{position:absolute;right:12px;top:12px;width:290px;background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.15);padding:14px;z-index:1000;max-height:calc(100% - 24px);overflow-y:auto;display:none}
#panel-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:3px}
#panel h2{font-size:14px;font-weight:700;color:#202124;line-height:1.3}
.xbtn{cursor:pointer;font-size:16px;color:#5f6368;background:none;border:none;line-height:1;padding:0 0 0 6px;flex-shrink:0}
.psub{font-size:11px;color:#5f6368;margin-bottom:7px}
.cov-strip{height:4px;border-radius:2px;margin-bottom:10px}
.tabs{display:flex;gap:4px;margin-bottom:10px;border-bottom:1px solid #e8eaed;padding-bottom:7px}
.tab{font-size:11px;padding:3px 10px;border-radius:20px;cursor:pointer;border:1px solid #dadce0;background:transparent;color:#5f6368;font-weight:500;transition:all .15s}
.tab.on{background:#1a73e8;color:#fff;border-color:#1a73e8}
.srow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f1f3f4;font-size:12px}
.srow:last-child{border-bottom:none}
.sl{color:#5f6368}.sv{font-weight:500;color:#202124}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}
.pc-card{border-radius:8px;padding:8px 10px;margin-bottom:6px;border:1px solid rgba(0,0,0,.07)}
.pc-card:last-child{margin-bottom:0}
.pc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.pc-code{font-size:12px;font-weight:600;color:#202124}
.pc-name{font-size:11px;color:#5f6368;margin-bottom:3px}
.pc-meta{font-size:11px;color:#80868b}
.dr-item{padding:6px 0;border-bottom:1px solid #f1f3f4}
.dr-item:last-child{border-bottom:none}
.dr-name{font-size:12px;font-weight:500;color:#202124}
.dr-spec{display:inline-block;margin-top:2px;padding:1px 7px;border-radius:10px;font-size:10px;background:#e8f0fe;color:#1a73e8;font-weight:500}
.dr-addr{font-size:11px;color:#5f6368;margin-top:1px}
.sec-hdr{font-size:10px;font-weight:600;color:#80868b;text-transform:uppercase;letter-spacing:.05em;margin:8px 0 3px}
#legend{position:absolute;bottom:24px;left:12px;background:#fff;border-radius:11px;box-shadow:0 1px 8px rgba(0,0,0,.12);padding:9px 12px;z-index:999;pointer-events:none}
#legend h3{font-size:10px;font-weight:600;margin-bottom:6px;color:#5f6368;text-transform:uppercase;letter-spacing:.04em}
.li{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-size:11px;color:#202124}
.ld{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.pc-hint{font-size:10px;color:#5f6368;font-style:italic;margin-top:5px;padding-top:5px;border-top:1px solid #f1f3f4}
</style>
</head>

<script>
function showErr(t,m,s){
  document.getElementById('sc-load').style.display='none';
  document.getElementById('sc-err').style.display='block';
  document.getElementById('err-title').textContent=t;
  document.getElementById('err-msg').textContent=m;
  document.getElementById('err-steps').innerHTML=s;
}
function maskName(n){
  const p=n.replace('Dr. ','').split(' ');
  return 'Dr. '+p.map(x=>x[0]+'.').join('');
}

const COLS={green:'#2d9a4e',lightgreen:'#7ec850',amber:'#f0a500',darkyellow:'#c9a800',red:'#e05252'};
const CLABELS={green:'Green (≥2)',lightgreen:'Light green (1–2)',amber:'Amber (0.5–1)',darkyellow:'Dark yellow (<0.5)',red:'Light red (0)'};

function drCount(z){return z.pincodes.reduce((a,p)=>a+p.drs.length,0)}
function ratio(z){const d=drCount(z);return z.customers>0?(d/z.customers)*1000:0}
function covKey(z){return z.covOverride||'red'}
function pcCovKey(r){if(r===0)return'red';if(r<0.5)return'darkyellow';if(r<1)return'amber';if(r<2)return'lightgreen';return'green'}
function pcRatio(p){return p.customers>0?(p.drs.length/p.customers)*1000:0}

let gmap,zonePolys=[],pcPolys=[],drMarkers=[],labelMarkers=[],infoWin,curZ=null,activeZoneId=null;

function allSpecs(){
  const s=new Set();
  ZONES.forEach(z=>z.pincodes.forEach(p=>p.drs.forEach(d=>s.add(d.sp))));
  return[...s].sort();
}
function allPins(zid){
  const arr=[];
  (zid&&zid!=='all'?ZONES.filter(z=>z.id===zid):ZONES)
    .forEach(z=>z.pincodes.forEach(p=>{if(!arr.find(x=>x.code===p.code))arr.push({code:p.code,name:p.name,zid:z.id})}));
  return arr.sort((a,b)=>a.code.localeCompare(b.code));
}

function buildSelects(){
  ZONES.forEach(z=>{const o=document.createElement('option');o.value=z.id;o.textContent=z.name;document.getElementById('zf').appendChild(o)});
  allPins().forEach(p=>{const o=document.createElement('option');o.value=p.code;o.textContent=p.code+' – '+p.name;document.getElementById('pf').appendChild(o)});
  allSpecs().forEach(sp=>{const o=document.createElement('option');o.value=sp;o.textContent=sp;document.getElementById('spf').appendChild(o)});
  document.getElementById('zf').addEventListener('change',()=>{
    const zid=document.getElementById('zf').value;
    const ps=document.getElementById('pf');
    ps.innerHTML='<option value="all">All pincodes</option>';
    allPins(zid).forEach(p=>{const o=document.createElement('option');o.value=p.code;o.textContent=p.code+' – '+p.name;ps.appendChild(o)});
    render();
  });
  ['cf','spf','pf'].forEach(id=>document.getElementById(id).addEventListener('change',render));
  document.getElementById('srch').addEventListener('input',render);
}

function updateSummary(fz){
  const totC=fz.reduce((a,z)=>a+z.customers,0);
  const totD=fz.reduce((a,z)=>a+drCount(z),0);
  document.getElementById('sc1').textContent=totC.toLocaleString('en-IN');
  document.getElementById('sc2').textContent=totD;
  document.getElementById('sc3').textContent=fz.length;
  document.getElementById('sc4').textContent=fz.filter(z=>covKey(z)==='red'||covKey(z)==='darkyellow').length;
}

function getFiltered(){
  const zf=document.getElementById('zf').value;
  const pf=document.getElementById('pf').value;
  const cf=document.getElementById('cf').value;
  const spf=document.getElementById('spf').value;
  const sr=document.getElementById('srch').value.toLowerCase();
  return ZONES.filter(z=>{
    if(zf!=='all'&&z.id!==zf)return false;
    if(pf!=='all'&&!z.pincodes.find(p=>p.code===pf))return false;
    if(cf!=='all'&&covKey(z)!==cf)return false;
    if(spf!=='all'&&!z.pincodes.some(p=>p.drs.some(d=>d.sp===spf)))return false;
    if(sr&&!z.name.toLowerCase().includes(sr)&&!z.pincodes.some(p=>p.code.includes(sr)||p.name.toLowerCase().includes(sr)))return false;
    return true;
  });
}

function clearPcPolys(){pcPolys.forEach(p=>p.setMap(null));pcPolys=[];}

function drawPincodeBoundaries(z){
  clearPcPolys();
  const zBounds=new google.maps.LatLngBounds();
  z.shape.forEach(pt=>zBounds.extend(pt));
  const zSW=zBounds.getSouthWest(), zNE=zBounds.getNorthEast();
  const latSpan=zNE.lat()-zSW.lat(), lngSpan=zNE.lng()-zSW.lng();
  const cols=Math.ceil(Math.sqrt(z.pincodes.length));
  const rows=Math.ceil(z.pincodes.length/cols);

  z.pincodes.forEach((p,i)=>{
    const row=Math.floor(i/cols), col=i%cols;
    const latStep=latSpan/rows, lngStep=lngSpan/cols;
    const s=zSW.lat()+row*latStep, n=s+latStep;
    const w=zSW.lng()+col*lngStep, e=w+lngStep;
    const pcShape=[{lat:n,lng:w},{lat:n,lng:e},{lat:s,lng:e},{lat:s,lng:w}];
    const pc=COLS[p.covO||'red'];

    const poly=new google.maps.Polygon({
      paths:pcShape,strokeColor:'#ffffff',strokeOpacity:0.85,strokeWeight:1.5,
      fillColor:pc,fillOpacity:0.70,map:gmap,zIndex:5
    });
    const cLat=(n+s)/2, cLng=(e+w)/2;
    const lbl=new google.maps.Marker({
      position:{lat:cLat,lng:cLng},map:gmap,
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:0},
      label:{text:p.code,color:'#fff',fontSize:'9px',fontWeight:'700'},
      zIndex:6,clickable:false
    });
    poly.addListener('click',()=>{
      if(infoWin)infoWin.close();
      const pr=pcRatio(p);
      infoWin=new google.maps.InfoWindow({
        position:{lat:cLat,lng:cLng},
        content:`<div style="padding:10px 12px;font-family:system-ui;min-width:190px">
          <div style="font-size:13px;font-weight:700;margin-bottom:3px">${p.code} — ${p.name}</div>
          <div style="font-size:12px;color:#5f6368;line-height:1.8">
            Customers: <b style="color:#202124">${p.customers.toLocaleString('en-IN')}</b><br>
            Doctors: <b style="color:#202124">${p.drs.length}</b><br>
            Coverage: <b style="color:${pc}">${pr.toFixed(2)} / 1000</b>
          </div>
        </div>`
      });
      infoWin.open(gmap);
    });
    pcPolys.push(poly,lbl);
  });
}

function render(){
  if(!gmap)return;
  zonePolys.forEach(p=>p.setMap(null));
  drMarkers.forEach(m=>m.setMap(null));
  labelMarkers.forEach(m=>m.setMap(null));
  clearPcPolys();
  zonePolys=[];drMarkers=[];labelMarkers=[];
  if(infoWin)infoWin.close();
  activeZoneId=null;

  const fz=getFiltered();
  updateSummary(fz);
  const spf=document.getElementById('spf').value;
  const pf=document.getElementById('pf').value;
  const bounds=new google.maps.LatLngBounds();

  fz.forEach(z=>{
    const k=covKey(z);const c=COLS[k];
    z.shape.forEach(pt=>bounds.extend(pt));

    const poly=new google.maps.Polygon({
      paths:z.shape,strokeColor:c,strokeOpacity:1,strokeWeight:2,
      fillColor:c,fillOpacity:0.28,map:gmap,zIndex:2
    });
    poly.addListener('click',()=>{
      zonePolys.forEach(p=>p.setOptions({strokeWeight:2,fillOpacity:0.28}));
      poly.setOptions({strokeWeight:3,fillOpacity:0.12});
      activeZoneId=z.id;
      drawPincodeBoundaries(z);
      openPanel(z);
    });
    poly.addListener('mouseover',function(){if(activeZoneId!==z.id)this.setOptions({fillOpacity:0.45,strokeWeight:2.5})});
    poly.addListener('mouseout',function(){if(activeZoneId!==z.id)this.setOptions({fillOpacity:0.28,strokeWeight:2})});
    zonePolys.push(poly);

    const ctr=z.shape.reduce((a,p)=>({lat:a.lat+p.lat/z.shape.length,lng:a.lng+p.lng/z.shape.length}),{lat:0,lng:0});
    const lbl=new google.maps.Marker({
      position:ctr,map:gmap,
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:0},
      label:{text:z.name,color:'#fff',fontSize:'10px',fontWeight:'700'},
      zIndex:3,clickable:false
    });
    labelMarkers.push(lbl);

    z.pincodes.forEach(p=>{
      if(pf!=='all'&&p.code!==pf)return;
      p.drs.forEach(d=>{
        if(spf!=='all'&&d.sp!==spf)return;
        const jlat=p.lat+(Math.random()-0.5)*0.005;
        const jlng=p.lng+(Math.random()-0.5)*0.005;
        const mk=new google.maps.Marker({
          position:{lat:jlat,lng:jlng},map:gmap,
          icon:{path:google.maps.SymbolPath.CIRCLE,scale:6,fillColor:'#1D9E75',fillOpacity:1,strokeColor:'#fff',strokeWeight:2},
          title:maskName(d.n),zIndex:10
        });
        mk.addListener('click',()=>{
          if(infoWin)infoWin.close();
          infoWin=new google.maps.InfoWindow({
            content:`<div style="padding:10px 12px;font-family:system-ui;min-width:175px">
              <div style="font-size:13px;font-weight:600;margin-bottom:4px">${maskName(d.n)}</div>
              <div style="font-size:12px;color:#5f6368;line-height:1.6">
                <span style="background:#e8f0fe;color:#1a73e8;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:500">${d.sp}</span><br>
                ${d.addr}<br><span style="color:#80868b">${p.code} – ${p.name}</span>
              </div>
            </div>`
          });
          infoWin.open(gmap,mk);
        });
        drMarkers.push(mk);
      });
    });
  });
  if(fz.length>0&&!bounds.isEmpty())gmap.fitBounds(bounds,{top:40,right:40,bottom:40,left:40});
}

function openPanel(z){
  curZ=z;
  document.getElementById('ptitle').textContent=z.name;
  document.getElementById('psub').textContent=z.pincodes.length+' pincodes · '+z.customers.toLocaleString('en-IN')+' customers';
  const c=COLS[covKey(z)];
  document.getElementById('covstrip').style.cssText='background:'+c+';height:4px;border-radius:2px;margin-bottom:10px';
  swTab('zone',document.querySelector('.tab'));
  document.getElementById('panel').style.display='block';
}
function closePanel(){
  document.getElementById('panel').style.display='none';
  clearPcPolys();
  zonePolys.forEach(p=>p.setOptions({strokeWeight:2,fillOpacity:0.28}));
  activeZoneId=null;
}
function swTab(tab,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  if(btn)btn.classList.add('on');
  ['zone','pins','drs'].forEach(t=>document.getElementById('t'+t).style.display=t===tab?'block':'none');
  if(!curZ)return;
  const z=curZ;const k=covKey(z);const c=COLS[k];const r=ratio(z);
  if(tab==='zone'){
    document.getElementById('tzone').innerHTML=`
      <div class="srow"><span class="sl">Customers</span><span class="sv">${z.customers.toLocaleString('en-IN')}</span></div>
      <div class="srow"><span class="sl">Total doctors</span><span class="sv">${drCount(z)}</span></div>
      <div class="srow"><span class="sl">Dr / 1000 customers</span><span class="sv">${r.toFixed(2)}</span></div>
      <div class="srow"><span class="sl">Coverage status</span><span class="badge" style="background:${c}22;color:${c};border:1px solid ${c}55">${CLABELS[k]}</span></div>
      <div class="srow"><span class="sl">Pincodes</span><span class="sv">${z.pincodes.length}</span></div>
      <div class="srow"><span class="sl">Specialties</span><span class="sv">${[...new Set(z.pincodes.flatMap(p=>p.drs.map(d=>d.sp)))].length}</span></div>
      <div class="pc-hint">Click the zone on the map to reveal pincode boundaries</div>`;
  } else if(tab==='pins'){
    document.getElementById('tpins').innerHTML=z.pincodes.map(p=>{
      const pr=pcRatio(p);const pc=COLS[p.covO||pcCovKey(pr)];
      return`<div class="pc-card" style="background:${pc}0d;border-color:${pc}44">
        <div class="pc-top"><span class="pc-code">${p.code}</span>
        <span class="badge" style="background:${pc}22;color:${pc};border:1px solid ${pc}55">${pr.toFixed(2)}/1000</span></div>
        <div class="pc-name">${p.name}</div>
        <div class="pc-meta">${p.customers.toLocaleString('en-IN')} customers · ${p.drs.length} doctors</div>
      </div>`;
    }).join('');
  } else {
    let h='';
    z.pincodes.forEach(p=>{
      if(!p.drs.length)return;
      h+=`<div class="sec-hdr">${p.code} · ${p.name}</div>`;
      p.drs.forEach(d=>{
        h+=`<div class="dr-item"><div class="dr-name">${maskName(d.n)}</div><span class="dr-spec">${d.sp}</span><div class="dr-addr">${d.addr}</div></div>`;
      });
    });
    document.getElementById('tdrs').innerHTML=h||'<p style="font-size:12px;color:#5f6368;padding:8px 0">No doctors in this zone.</p>';
  }
}

window.initMap=function(){
  document.getElementById('status-screen').style.display='none';
  gmap=new google.maps.Map(document.getElementById('map'),{
    center:{lat:18.5204,lng:73.8567},zoom:12,mapTypeId:'roadmap',
    zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_CENTER},
    mapTypeControlOptions:{style:google.maps.MapTypeControlStyle.HORIZONTAL_BAR,position:google.maps.ControlPosition.TOP_RIGHT},
    streetViewControl:false,fullscreenControl:true,
    styles:[{featureType:'poi',elementType:'labels',stylers:[{visibility:'off'}]}]
  });
  buildSelects();render();
};
window.gm_authFailure=function(){showErr('API key auth failed','Maps JS API key issue.','Enable Maps JavaScript API in Google Cloud Console → APIs & Services → Library');};
setTimeout(()=>{if(!gmap)showErr('Map timed out','Open Chrome DevTools → Console → share the error.','');},10000);
